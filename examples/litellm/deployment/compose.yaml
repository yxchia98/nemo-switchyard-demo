services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    build:
      context: ../../..
      dockerfile: examples/litellm/deployment/Dockerfile
    image: switchyard-litellm:1.97.0
    command:
      - --config
      - /app/deployment/litellm.yaml
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      SWITCHYARD_LITELLM_CONFIG: /app/deployment/switchyard.toml
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      UI_USERNAME: ${UI_USERNAME:?set UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD:?set UI_PASSWORD}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./profiles/${SWITCHYARD_LITELLM_PROFILE:-stage}:/app/deployment:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

volumes:
  litellm_postgres_data:

networks:
  default:
    name: ${LITELLM_NETWORK:-switchyard-litellm}
