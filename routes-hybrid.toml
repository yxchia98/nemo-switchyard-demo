schema_version = 1

[llm_clients.local_nim]
format = "openai_chat"
base_url = "http://192.168.1.10:8000/v1/chat/completions"

[llm_clients.openrouter]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[targets.weak]
id = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
llm_client = "local_nim"

[targets.strong]
id = "openrouter/free"
llm_client = "openrouter"

[routes.ab_test]
id = "switchyard/ab-test"
type = "random"
targets = ["strong", "weak"]
weights = [3, 7]
seed = 42

[routes.escalate]
id = "switchyard/escalate"
type = "llm_classifier"
mode = "escalation"
classifier_target = "weak"
strong_target = "strong"
weak_target = "weak"
prompt = "Judge whether the weak model is stuck. Return the required structured verdict."
escalation = { confirmations = 2, recent_turn_window = 28, window_message_chars = 500 }

[routes.smart]
id = "switchyard/smart"
type = "llm_classifier"
mode = "capability"
classifier_target = "weak"
strong_target = "strong"
weak_target = "weak"
base_threshold = 0.3
threshold_step = 0.1
prompt = """
Estimate whether the weak target can complete the request.
Return exactly one JSON object matching the response schema supplied with the request.
"""

[routes.stage]
id = "switchyard/stage"
type = "stage_router"
capable_target = "strong"
efficient_target = "weak"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3 