schema_version = 1

[llm_clients.openrouter]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[llm_clients.nim]
format = "openai_chat"
base_url = "https://integrate.api.nvidia.com/v1/chat/completions"
api_key_env = "NVIDIA_API_KEY"

[targets.classifier]
id = "nvidia/nemotron-3.5-lightning:free"
llm_client = "openrouter"
extra_body = { chat_template_kwargs = { enable_thinking = true }, "reasoning_budget" = "2048" }

[targets.weak]
id = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
llm_client = "openrouter"

[targets.strong]
id = "nvidia/nemotron-3-ultra-550b-a55b:free"
llm_client = "openrouter"

[routes.ab_test]
id = "switchyard/ab-test"
type = "random"
targets = ["strong", "weak"]
weights = [3, 7]
seed = 42

[routes.escalate]
id = "switchyard/escalate"
type = "llm_classifier"
mode = "escalation"
classifier_target = "weak"
strong_target = "strong"
weak_target = "weak"
prompt = "Judge whether the weak model is stuck. Return the required structured verdict."
escalation = { confirmations = 2, recent_turn_window = 28, window_message_chars = 500 }

[routes.smart]
id = "switchyard/smart"
type = "llm_classifier"
mode = "capability"
classifier_target = "classifier"
strong_target = "strong"
weak_target = "weak"
base_threshold = 0.8
threshold_step = 0.1

[routes.stage]
id = "switchyard/stage"
type = "stage_router"
capable_target = "strong"
efficient_target = "weak"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3 

